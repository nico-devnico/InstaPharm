# =============================================================================
# InstaPharm — OSRM Multi-Level Dijkstra (MLD) + trafic temps réel
# =============================================================================
#
# Pipeline :
#   [OSM Cameroun] → osrm-extract → osrm-partition     (1×)
#                          |
#   [Flux trafic CSV] → osrm-customize                 (toutes les X min)
#                          |
#                    osrm-routed --algorithm mld → app Flutter
#
# Prérequis : Docker + ~4 Go disque libre
# Usage :
#   cd infra/osrm
#   ./scripts/build_mld.sh          # extract + partition (long, 1×)
#   docker compose up -d            # moteur MLD
#   ./scripts/customize_loop.sh     # boucle trafic → customize
#
# Puis dans .env Flutter :
#   OSRM_BASE_URL=http://VOTRE_IP:5000
# =============================================================================

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: instapharm-osrm-mld
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    # Moteur MLD : requêtes fluides avec graphe partitionné + customize trafic
    command: >
      osrm-routed --algorithm mld
      --max-table-size 10000
      /data/cameroon-latest.osrm
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/route/v1/driving/9.7,4.05;11.5,3.87?overview=false"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Régénère le fichier vitesse + osrm-customize périodiquement
  traffic-customize:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: instapharm-osrm-customize
    volumes:
      - ./data:/data
      - ./scripts:/scripts:ro
    entrypoint: ["/bin/sh", "/scripts/customize_loop.sh"]
    depends_on:
      - osrm
    restart: unless-stopped
    environment:
      TRAFFIC_INTERVAL_MIN: "5"
      DATA_DIR: /data
