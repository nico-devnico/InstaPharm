name: instapharm
description: "InstaPharm - Géolocalisation intelligente de pharmacies et livraison de médicaments au Cameroun"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  equatable: ^2.1.0
  flutter_map: ^6.2.1
  flutter_riverpod: ^2.6.1
  geolocator: ^11.1.0
  google_fonts: ^6.3.3
  http: ^1.6.0
  latlong2: ^0.9.1
  permission_handler: ^11.4.0
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  shared_preferences: ^2.5.5
  file_picker: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
